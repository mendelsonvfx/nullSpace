[package]
name = "nullspace"
version = "1.9.21"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = [ "fs-remove-file", "fs-read-dir", "fs-read-file", "fs-copy-file", "fs-create-dir", "fs-remove-dir", "fs-write-file", "clipboard-read-text", "clipboard-write-text", "window-hide", "window-set-resizable", "window-unminimize", "window-set-title", "window-set-fullscreen", "window-show", "window-unmaximize", "window-close", "window-minimize", "window-maximize", "window-start-dragging", "dialog-all", "path-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.18"
url = "2.5"
notify = "6.1"
notify-debouncer-mini = "0.7"
sysinfo = "0.30"
lazy_static = "1.4"
parking_lot = "0.12"
regex = "1.10"
arboard = { version = "3.3", features = ["image-data"] }
base64 = "0.21"
image = "0.24"
walkdir = "2.4"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_UI_Shell"] }
winreg = "0.52"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[[bin]]
name = "nullspace"
path = "src/main.rs"
