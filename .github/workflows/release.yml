name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: npm run build

      - name: Build binary
        working-directory: src-tauri
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: cargo build --release --features custom-protocol

      - name: Prepare release files
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/nullspace.exe"
          $zipName = "nullSpace-${{ github.ref_name }}.zip"
          $exeName = "nullSpace.exe"

          Copy-Item $exePath $exeName
          Compress-Archive -Path $exeName -DestinationPath $zipName

      - name: Publish release (for auto-updater)
        uses: softprops/action-gh-release@v2
        with:
          repository: mendelsonvfx/nullSpace-releases
          token: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            nullSpace.exe
            nullSpace-*.zip
          generate_release_notes: true

      - name: Create GitHub Release (internal archive)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nullSpace.exe
            nullSpace-*.zip
          generate_release_notes: true
